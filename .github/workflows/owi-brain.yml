name: OWI Brain (I&W daily)

on:
  schedule:
    - cron: "20 4 * * *"      # 04:20 UTC ogni giorno. Per aumentare: "20 */6 * * *"
  workflow_dispatch:           # bottone "Run workflow" per lanciarlo a mano

permissions:
  contents: write

concurrency:
  group: owi-brain
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Raccolta + analisi
        working-directory: owi-brain
        env:
          OWI_SAMPLES: "2"          # campioni diretti adsb.lol (il grosso arriva dal feed live ogni 10 min)
          OWI_INTERVAL_MIN: "5"     # minuti fra i campioni
          OWI_GDELT_BUDGET_S: "240" # GDELT: oltre questo budget si salta (i runner GitHub prendono 429)
          PYTHONUNBUFFERED: "1"
        run: python run_all.py

      - name: Commit memoria e report
        if: always()   # salva comunque quello che e' stato raccolto, anche se un passo e' fallito
        run: |
          git config user.name "owi-brain"
          git config user.email "brain@openwarintelligence.org"
          git add owi-brain/memory owi-brain/out owi-brain/model.json 2>/dev/null || true
          git add owi-brain/memory owi-brain/out
          if git diff --cached --quiet; then
            echo "nessuna modifica"
          else
            git commit -m "brain: run $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
